[project]
name = "foundation-models"
version = "0.1.0"
description = "Rail track segmentation using DINOv2 foundation model"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Madhav Koodana Madhu", email = "s0595458@htw-berlin.de"}
]

dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "transformers>=4.36.0",
    "opencv-python>=4.8.1",
    "scikit-image>=0.22.0",
    "Pillow>=10.1.0",
    "numpy>=1.26.2",
    "pandas>=2.1.4",
    "matplotlib>=3.8.2",
    "seaborn>=0.13.0",
    "streamlit>=1.29.0",
    "tqdm>=4.66.1",
]

[project.urls]
Repository = "https://github.com/username/repo-name"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
